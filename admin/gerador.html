<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Tokens | Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050807;
      --card:rgba(15,20,17,.9);
      --accent:#8bc34a;
      --accent-light:#c9e265;
      --border:rgba(139,195,74,.25);
      --text:#f1f8e9;
      --muted:#b2df8a;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Space Grotesk',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:2.5rem;
      max-width:520px;
      width:100%;
      box-shadow:0 0 40px rgba(0,0,0,.4);
    }
    h1{
      font-family:'Orbitron';
      font-size:1.8rem;
      text-align:center;
      margin-bottom:2rem;
      background:linear-gradient(90deg,var(--accent),var(--accent-light));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    label{
      font-weight:600;
      display:block;
      margin-bottom:0.4rem;
      color:var(--muted);
    }
    input, select{
      width:100%;
      padding:0.9rem 1rem;
      border-radius:14px;
      border:1px solid var(--border);
      background:#0b120f;
      color:var(--text);
      margin-bottom:1.2rem;
      font-size:1rem;
    }
    button{
      width:100%;
      padding:1rem;
      border:none;
      border-radius:50px;
      font-weight:700;
      cursor:pointer;
      font-size:1rem;
      background:linear-gradient(135deg,var(--accent),#689f38);
      color:#000;
      transition:.25s;
    }
    button:hover{transform:translateY(-2px)}
    .result{
      margin-top:1.5rem;
      background:#0b120f;
      border:1px dashed var(--border);
      border-radius:16px;
      padding:1rem;
      text-align:center;
    }
    .token{
      font-size:1.2rem;
      font-weight:700;
      letter-spacing:2px;
      margin-bottom:0.5rem;
      color:var(--accent-light);
      word-break:break-all;
    }
    .copy{
      margin-top:0.6rem;
      background:none;
      border:1px solid var(--border);
      color:var(--accent);
      padding:0.4rem 1rem;
      border-radius:50px;
      font-size:0.85rem;
      cursor:pointer;
    }
    .copy:hover{background:rgba(139,195,74,.1)}
    .footer{
      text-align:center;
      margin-top:1.5rem;
      font-size:0.8rem;
      color:var(--muted);
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Gerador de Tokens</h1>

    <label>Validade do token (em dias)</label>
    <input type="number" id="days" value="7" min="1" />

    <label>Tamanho do token</label>
    <select id="length">
      <option value="8">8 caracteres</option>
      <option value="10">10 caracteres</option>
      <option value="12" selected>12 caracteres</option>
      <option value="16">16 caracteres</option>
    </select>

    <button onclick="gerar()">Gerar Token</button>

    <div id="output"></div>

    <div class="footer">Uso interno • Tokens únicos e temporários</div>
  </div>

<script>
  function gerar(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const length = parseInt(document.getElementById('length').value);
    const days = parseInt(document.getElementById('days').value);

    let token = '';
    for(let i=0;i<length;i++){
      token += chars.charAt(Math.floor(Math.random()*chars.length));
    }

    const expira = new Date();
    expira.setDate(expira.getDate() + days);

    const validade = expira.toLocaleDateString('pt-BR');

    document.getElementById('output').innerHTML = `
      <div class="result">
        <div class="token">${token}</div>
        <div>Expira em: <strong>${validade}</strong></div>
        <button class="copy" onclick="copiar('${token}')">Copiar token</button>
      </div>
    `;
  }

  function copiar(texto){
    navigator.clipboard.writeText(texto);
    alert('Token copiado!');
  }
  
</script>

</body>
</html>
